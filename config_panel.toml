#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/config_panel.v1.schema.json

version = "1.0"

[main]
name.en = "General"

    [main.info]
    name.en = ""

        [main.info.admin_info]
        type = "alert"
        style = "info"
        ask.en = "Sites (page texts, routes, button color), offers, codes and customers are managed from the app's admin page, /admin. One offer, code or grant can be linked to several sites at once."

    [main.shared]
    name.en = "Shared by all sites"

        [main.shared.currency]
        ask.en = "Currency"
        type = "select"
        choices = ["usd", "eur", "gbp", "cad", "aud", "nzd", "chf", "sek", "nok", "dkk", "pln", "czk", "brl", "mxn", "inr", "sgd", "hkd", "jpy", "krw"]
        default = "usd"
        help.en = "Changing it does not convert existing prices: check your offers afterwards."

        [main.shared.session_days]
        ask.en = "Remember paying visitors for (days)"
        type = "number"
        min = 1
        max = 3650
        default = 365

        [main.shared.callback_prefix]
        ask.en = "Reserved path on protected sites"
        type = "string"
        default = "/__paywall"
        pattern.regexp = "^/[A-Za-z0-9_-]+$"
        pattern.error = "Must look like /__paywall"

[payments]
name.en = "Payments"

    [payments.provider]
    name.en = "Payment provider"

        [payments.provider.payment_provider]
        ask.en = "How do visitors pay?"
        type = "select"
        choices.stripe = "Stripe"
        choices.none = "No online payment (access codes only)"
        default = "stripe"

        [payments.provider.stripe_secret_key]
        ask.en = "Stripe API key"
        type = "password"
        optional = true
        visible = "payment_provider == 'stripe'"
        help.en = "Use a restricted key (rk_live_... or rk_test_...) from https://dashboard.stripe.com/apikeys with Write on Checkout Sessions, Products, Coupons and Customer portal, and Read on Subscriptions. Test with a sandbox key first."

        [payments.provider.stripe_webhook_secret]
        ask.en = "Stripe webhook signing secret"
        type = "password"
        optional = true
        visible = "payment_provider == 'stripe'"
        help.en = "whsec_... Create a webhook endpoint in Stripe (URL below) for the events checkout.session.completed, checkout.session.async_payment_succeeded, checkout.session.async_payment_failed, customer.subscription.updated, customer.subscription.deleted, invoice.paid, charge.refunded and charge.dispute.created."

        [payments.provider.webhook_info]
        type = "alert"
        style = "info"
        ask.en = "Stripe webhook URL"
        visible = "payment_provider == 'stripe'"

    [payments.tax]
    name.en = "Tax and invoices"
    visible = "payment_provider == 'stripe'"

        [payments.tax.stripe_invoices]
        ask.en = "Create an invoice for one-time payments"
        type = "boolean"
        default = true
        help.en = "Stripe emails a PDF invoice and keeps it in the customer portal. Subscriptions always get invoices. Stripe charges a small fee for invoices on one-time payments."

        [payments.tax.stripe_automatic_tax]
        ask.en = "Collect sales tax / VAT with Stripe Tax"
        type = "boolean"
        default = false
        help.en = "Turn on only after setting a head office address and adding your tax registrations in Stripe (Dashboard, Tax). Without an active registration Stripe collects no tax, and shows no error."

        [payments.tax.stripe_tax_behavior]
        ask.en = "Are your prices tax-inclusive?"
        type = "select"
        choices.account_default = "Use the default from my Stripe Tax settings"
        choices.inclusive = "Yes, prices include tax"
        choices.exclusive = "No, tax is added on top"
        default = "account_default"

        [payments.tax.stripe_tax_code]
        ask.en = "Stripe product tax code"
        type = "string"
        optional = true
        pattern.regexp = "^(txcd_[0-9]{8})?$"
        pattern.error = "Must look like txcd_12345678"
        help.en = "Leave empty to use the preset tax code from your Stripe Tax settings. Otherwise pick the code that matches what you sell from https://docs.stripe.com/tax/tax-codes (ask your tax advisor if unsure)."

        [payments.tax.stripe_collect_tax_ids]
        ask.en = "Let business customers enter a tax ID (VAT number)"
        type = "boolean"
        default = false
        help.en = "Needed for reverse-charge on cross-border B2B sales; shown on invoices."

    [payments.email]
    name.en = "Restore access by email"

        [payments.email.enable_email_login]
        ask.en = "Let customers get a sign-in link by email"
        type = "boolean"
        default = true
        help.en = "Lets people regain access on a new device. Emails are sent through this server's mail system."

        [payments.email.mail_from]
        ask.en = "Sender address"
        type = "email"
        optional = true
        visible = "enable_email_login"
        help.en = "Defaults to noreply@<paywall domain>"

[cloudflare]
name.en = "Cloudflare"

    [cloudflare.api]
    name.en = "Cloudflare API"

        [cloudflare.api.cf_api_token]
        ask.en = "API token"
        type = "password"
        optional = true
        help.en = "Create it at https://dash.cloudflare.com/profile/api-tokens with: Account > Workers Scripts > Edit, Zone > Workers Routes > Edit, Zone > Zone > Read."

        [cloudflare.api.cf_account_id]
        ask.en = "Account ID"
        type = "string"
        optional = true
        help.en = "Shown in the right sidebar of any zone overview page in the Cloudflare dashboard."

        [cloudflare.api.cf_zone_id]
        ask.en = "Zone ID (optional)"
        type = "string"
        optional = true
        help.en = "Leave empty to detect it from the protected routes. Set it if the token cannot list zones."

        [cloudflare.api.worker_name]
        ask.en = "Worker name"
        type = "string"
        optional = true
        pattern.regexp = "^[a-z0-9][a-z0-9-]{0,62}$"
        pattern.error = "Lowercase letters, digits and dashes only"
        help.en = "Defaults to the app id, e.g. paywall-worker"

        [cloudflare.api.cf_auto_deploy]
        ask.en = "Update the Worker automatically when settings are saved"
        type = "boolean"
        default = true

        [cloudflare.api.cf_cleanup_on_remove]
        ask.en = "Remove the Worker and its routes when this app is uninstalled"
        type = "boolean"
        default = true

    [cloudflare.deploy]
    name.en = "Deployment"

        [cloudflare.deploy.worker_status]
        type = "alert"
        style = "info"
        ask.en = "Never deployed"

        [cloudflare.deploy.deploy_worker]
        ask.en = "Deploy / update the Worker now"
        type = "button"
        style = "success"
