<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{{ brand.title }}{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/barlow-condensed-latin-600-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --accent: {{ brand.accent_color }}; --accent-ink: {{ brand.accent_ink }}; }</style>
</head>
<body>
  <main class="booth {% block booth_class %}{% endblock %}">
    {% block content %}{% endblock %}
    {% if brand.support_email %}
      <footer>Questions about access or billing: <a href="mailto:{{ brand.support_email }}">{{ brand.support_email }}</a></footer>
    {% endif %}
  </main>
</body>
</html>
