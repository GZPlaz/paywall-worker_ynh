<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{{ cfg.paywall_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --accent: {{ cfg.accent_color }}; }</style>
</head>
<body>
  <main class="wrap {% block wrap_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    {% if cfg.support_email %}
      <p class="center muted section">Questions? <a href="mailto:{{ cfg.support_email }}">{{ cfg.support_email }}</a></p>
    {% endif %}
  </main>
</body>
</html>
