{% extends "base.html" %}
{% block title %}{{ title }} – {{ brand.title }}{% endblock %}
{% block booth_class %}single{% endblock %}
{% block content %}
<section class="window">
  {% include "_notices.html" %}
  <h1>{{ title }}</h1>
  <p class="lede">{{ message }}</p>
  <div class="aside">
    {% if link %}<p><a class="btn" href="{{ link }}">{{ link_label }}</a></p>{% endif %}
    <p><a href="{{ url_for('site_page', site_id=brand.id) if brand.id else url_for('index') }}">Back to {{ brand.title }}</a></p>
  </div>
</section>
{% endblock %}
