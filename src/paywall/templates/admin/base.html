<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Admin{% endblock %} – {{ cfg.paywall_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --accent: {{ cfg.accent_color }}; --accent-ink: {{ cfg.accent_ink }}; }</style>
</head>
<body>
  <div class="desk">
    {% set active = request.endpoint %}
    <header class="desk-head">
      <span class="name">{{ cfg.paywall_title }}</span>
      <nav aria-label="Admin">
        <a href="{{ url_for('admin.dashboard') }}" {% if active == 'admin.dashboard' %}aria-current="page"{% endif %}>Overview</a>
        <a href="{{ url_for('admin.codes_page') }}" {% if active == 'admin.codes_page' %}aria-current="page"{% endif %}>Codes</a>
        <a href="{{ url_for('admin.customers_page') }}" {% if active in ('admin.customers_page', 'admin.customer_page') %}aria-current="page"{% endif %}>Customers</a>
        <a href="{{ url_for('admin.cloudflare_page') }}" {% if active == 'admin.cloudflare_page' %}aria-current="page"{% endif %}>Cloudflare</a>
        <a href="{{ url_for('index', stay=1) }}" target="_blank" rel="noopener">Open the paywall</a>
      </nav>
    </header>
    {% include "_notices.html" %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
